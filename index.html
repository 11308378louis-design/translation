<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17243a">
<title>翻譯訂正庫</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--line:#e4e9f0;--text:#172033;--muted:#667085;--nav:#17243a;--nav2:#243957;--blue:#eaf2ff;--blueText:#194fa3;--green:#ebf8ef;--greenText:#0d7542;--red:#fff0f0;--redLine:#ef5350;--yellow:#fff8df;--yellowLine:#e0b000;--info:#eef5ff;--infoLine:#4d7bd9;--accent:#d94d68;--shadow:0 8px 24px rgba(26,38,58,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:370px 1fr}.sidebar{background:var(--nav);color:#fff;min-height:100vh;position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}.sideTop{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:21px;margin:0}.sub{color:#9fb0c7;font-size:12px;margin-top:4px}.search{margin-top:14px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:#fff;color:#172033}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid rgba(255,255,255,.18);background:transparent;color:#cbd6e6;border-radius:999px;padding:6px 9px;font-size:12px;cursor:pointer}.chip.on{background:#fff;color:#17243a;border-color:#fff}.setFilter{width:100%;margin-top:10px;padding:9px 10px;border:0;border-radius:9px;background:var(--nav2);color:#fff}
.list{overflow:auto;flex:1}.item{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}.item:hover,.item.on{background:var(--nav2)}.item b{display:block;line-height:1.35}.meta{font-size:12px;color:#9eb0c9;margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.09)}
.main{padding:22px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.topbar h2{margin:0;font-size:21px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.empty{height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.detail{padding:20px}.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.titleRow h2{margin:0 0 12px;font-size:24px}.score{padding:6px 9px;border-radius:999px;background:#eef2f6;font-weight:800;font-size:12px;white-space:nowrap}.zh{background:var(--blue);color:var(--blueText);padding:14px 15px;border-radius:11px;font-weight:750;line-height:1.75}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:700}.btn.on{background:#17243a;color:#fff;border-color:#17243a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{padding:14px;border-radius:11px;background:#f8fafc;line-height:1.75;border:1px solid #edf0f4}.pane.good{background:var(--green);color:var(--greenText)}.pane.hiddenAnswer{filter:blur(7px);user-select:none}.sectionTitle{font-size:14px;margin:18px 0 8px}
.note{padding:10px 12px;border-radius:10px;margin:8px 0;line-height:1.55}.note.error{background:var(--red);border-left:4px solid var(--redLine)}.note.suggest{background:var(--yellow);border-left:4px solid var(--yellowLine)}.note.important{background:var(--info);border-left:4px solid var(--infoLine)}
.noteTop{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.kind{font-size:11px;font-weight:900;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.75)}.arrow{font-weight:900;color:#14944f}.explain{font-size:13px;color:var(--muted);margin-top:4px}.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;background:#fff;color:#526071}.small{font-size:12px;color:var(--muted)}.modeBanner{display:none;margin-bottom:12px;padding:10px 12px;border-radius:10px;background:#fff3cd;color:#7a5a00;border:1px solid #ffe69c}.modeBanner.on{display:block}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;min-height:0}.list{max-height:310px}.main{padding:12px}}@media(max-width:620px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.titleRow{flex-direction:column}.detail{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sideTop">
    <div class="brand"><div><h1>翻譯訂正庫</h1><div class="sub">你的歷史翻譯錯題本</div></div><span class="badge" id="countBadge"></span></div>
    <input id="search" class="search" placeholder="搜尋中文、英文、錯誤…" oninput="renderList()">
    <select id="setFilter" class="setFilter" onchange="renderList()"></select>
    <div class="filters">
      <button class="chip on" id="allChip" onclick="setMode('all')">全部</button>
      <button class="chip" id="errorChip" onclick="setMode('errors')">只看有錯</button>
      <button class="chip" id="missChip" onclick="setMode('missing')">只看漏譯</button>
    </div>
  </div>
  <div id="list" class="list"></div>
</aside>
<main class="main">
  <div class="topbar">
    <div><h2>翻譯檔案庫</h2><div class="small">更新日期：2026-08-21</div></div>
    <div class="stats"><div class="stat"><b id="visibleCount">0</b> 題</div><div class="stat"><b id="errorCount">0</b> 錯誤</div><div class="stat"><b id="suggestCount">0</b> 建議</div></div>
  </div>
  <div id="modeBanner" class="modeBanner">重翻模式：訂正版已隱藏。先自己翻完，再按「顯示訂正版」。</div>
  <section id="right" class="panel"><div class="empty"><div><div style="font-size:42px">📝</div><h3>選一題開始複習</h3><p>左邊可以搜尋、依題組篩選，或只看真正錯誤。</p></div></div></section>
</main>
</div>
<script>
const DATA=[{"set": "英文翻譯訂正總整理", "id": "1.1", "title": "培養嗜好", "zh": "培養嗜好可以幫助學生放鬆身心，並減輕學業壓力。這對維持良好的生活品質非常重要。", "answer": "Keeping habits can help students relax and reduce the study pressure. It is important to maintain great life quality.", "corrected": "Having hobbies can help students relax and reduce study pressure. This is important for maintaining a good quality of life.", "notes": [["錯誤", "Keeping habits", "Having hobbies", "habit 是「習慣」；hobby 才是「嗜好」。"], ["錯誤", "the study pressure", "study pressure", "泛指學業壓力不需要 the。"], ["錯誤", "great life quality", "a good quality of life", "「生活品質」固定說法為 quality of life。"], ["重點", "important to maintain", "important for maintaining", "be important for + N/V-ing。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "搭配"]}, {"set": "英文翻譯訂正總整理", "id": "1.2", "title": "嗜好的其他好處", "zh": "除了帶來樂趣之外，嗜好也能提升專注力和創造力。因此，學生應該培養至少一項興趣。", "answer": "In addition to bring interests, habits also improve creativity and concentration. Therefore, students should keep at least of interest.", "corrected": "In addition to bringing enjoyment, hobbies can also improve concentration and creativity. Therefore, students should develop at least one hobby.", "notes": [["錯誤", "In addition to bring", "In addition to bringing", "to 是介系詞，後面接 V-ing。"], ["錯誤", "bring interests", "bring enjoyment", "「帶來樂趣」用 bring enjoyment。"], ["錯誤", "habits", "hobbies", "此處是「嗜好」。"], ["錯誤", "at least of interest", "at least one hobby", "at least one + 單數可數名詞。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞"]}, {"set": "英文翻譯訂正總整理", "id": "2.1", "title": "閱讀習慣", "zh": "有些學生喜歡在空閒時間閱讀小說，因為這能拓展他們的視野。這也有助於提升語言能力。", "answer": "Some of students like reading novel in their free time because it can broaden their horizon. It is also helpful to improve their language ability.", "corrected": "Some students like reading novels in their free time because reading can broaden their horizons. It also helps improve their language ability.", "notes": [["錯誤", "Some of students", "Some students", "泛指「有些學生」直接用 Some students。"], ["錯誤", "reading novel", "reading novels", "泛指小說時用複數。"], ["錯誤", "broaden their horizon", "broaden their horizons", "固定搭配 broaden one's horizons。"], ["建議", "It is also helpful to improve...", "It also helps improve...", "指涉更清楚，也更自然。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞", "搭配"]}, {"set": "英文翻譯訂正總整理", "id": "2.2", "title": "閱讀與想像力", "zh": "閱讀不同類型的書籍可以激發想像力。結果，學生能更有創意地思考問題。", "answer": "Reading a variety of books can inspire imagination, so students can think question more creative.", "corrected": "Reading different kinds of books can stimulate the imagination. As a result, students can think about problems more creatively.", "notes": [["建議", "inspire imagination", "stimulate the imagination", "較穩定的搭配。"], ["錯誤", "think question", "think about problems", "think about + N。"], ["錯誤", "more creative", "more creatively", "修飾 think 要用副詞。"], ["建議", "so", "As a result", "分成兩句時更清楚地表示結果。"]], "date": "", "source": "過去對話／題本照片", "tags": ["搭配"]}, {"set": "英文翻譯訂正總整理", "id": "3.1", "title": "運動", "zh": "運動是一種受歡迎的嗜好，因為它有助於維持健康。此外，它也能釋放壓力。", "answer": "Exercises are popular habits because it help maintain healthy. Therefore, it can also release the stress.", "corrected": "Exercise is a popular hobby because it helps people stay healthy. In addition, it can also relieve stress.", "notes": [["錯誤", "Exercises are", "Exercise is", "表示「運動」概念時通常不可數。"], ["錯誤", "popular habits", "a popular hobby", "「嗜好」用 hobby。"], ["錯誤", "it help", "it helps", "第三人稱單數。"], ["錯誤", "maintain healthy", "stay healthy", "healthy 是形容詞。"], ["建議", "release the stress", "relieve stress", "較自然；泛指 stress 不加 the。"], ["錯誤", "Therefore", "In addition", "此處是並列好處，不是因果。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞"]}, {"set": "英文翻譯訂正總整理", "id": "3.2", "title": "每天運動", "zh": "有些學生每天運動，以保持良好的體能。這使他們在學習時更有精力。", "answer": "Some of student exercise every day to maintain a great energy, which allow them having more energy in study.", "corrected": "Some students exercise every day to stay fit, which allows them to have more energy when they study.", "notes": [["錯誤", "Some of student", "Some students", "Some + 複數名詞。"], ["錯誤", "maintain a great energy", "stay fit", "energy 通常不可數；「保持體能」用 stay fit。"], ["錯誤", "which allow", "which allows", "which 指前面整件事，視為單數。"], ["錯誤", "allow them having", "allow them to have", "allow + 人 + to V。"], ["錯誤", "in study", "when they study", "「在學習時」不能用 in study。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞"]}, {"set": "英文翻譯訂正總整理", "id": "4.1", "title": "學習樂器", "zh": "學習樂器不僅能帶來成就感，也能培養耐心。這對個人成長非常有幫助。", "answer": "Learning instrument not merely bring a confidence but also develop a patience. It is quite helpful to personal improvement.", "corrected": "Learning musical instruments not only gives people a sense of achievement but also develops patience. This is very helpful for personal growth.", "notes": [["錯誤", "Learning instrument", "Learning musical instruments", "泛指學習樂器可用複數。"], ["錯誤", "bring / develop", "gives / develops", "動名詞片語作主詞視為單數。"], ["建議", "not merely...but also", "not only...but also", "較基本、穩定。"], ["錯誤", "a confidence", "a sense of achievement", "confidence 不可數；原文是成就感。"], ["錯誤", "a patience", "patience", "patience 不可數。"], ["建議", "personal improvement", "personal growth", "「個人成長」常用 personal growth。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "英文翻譯訂正總整理", "id": "4.2", "title": "參加音樂社團", "zh": "有些學生參加音樂社團，以提升自己的技巧。同時，他們也能結交志同道合的朋友。", "answer": "Some of students join musical clubs to improve their skills; meanwhile, they can make friends which have familiar interests.", "corrected": "Some students join music clubs to improve their skills. At the same time, they can make friends with people who share similar interests.", "notes": [["錯誤", "Some of students", "Some students", "泛指有些學生不用 of。"], ["錯誤", "musical clubs", "music clubs", "music club 才是「音樂社團」。"], ["錯誤", "make friends which", "make friends with people who", "make friends with + 人；人用 who。"], ["錯誤", "have familiar interests", "share similar interests", "常用搭配。"]], "date": "", "source": "過去對話／題本照片", "tags": ["搭配"]}, {"set": "英文翻譯訂正總整理", "id": "5.1", "title": "繪畫與情感", "zh": "繪畫是一種能表達情感的嗜好。透過藝術，學生可以更了解自己。", "answer": "Drawing is one of habits, which can express their emotion. Through art, students can realize themselves more.", "corrected": "Drawing is a hobby that allows people to express their feelings. Through art, students can understand themselves better.", "notes": [["錯誤", "one of habits", "a hobby", "若用 one of，應為 one of the hobbies。"], ["錯誤", "which can express their emotion", "that allows people to express their feelings", "繪畫本身不能「表達它的情感」。"], ["錯誤", "realize themselves more", "understand themselves better", "「更了解自己」用 understand oneself better。"]], "date": "", "source": "過去對話／題本照片", "tags": []}, {"set": "英文翻譯訂正總整理", "id": "5.2", "title": "持續練習繪畫", "zh": "如果學生持續練習，他們的繪畫技巧會逐漸進步。這也會提升他們的自信心。", "answer": "If students keep practicing, their drawing skill will develop steps by steps, which also develop their confidence.", "corrected": "If students keep practicing, their drawing skills will improve step by step, which will also increase their confidence.", "notes": [["錯誤", "drawing skill", "drawing skills", "泛指技巧通常用複數。"], ["建議", "will develop", "will improve", "skills improve 更自然。"], ["錯誤", "steps by steps", "step by step", "固定片語。"], ["錯誤", "which also develop", "which will also increase", "配合主要子句未來式。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞", "搭配"]}, {"set": "英文翻譯訂正總整理", "id": "6.1", "title": "攝影", "zh": "有些學生喜歡拍照，因為他們可以記錄生活中的美好時刻。這讓回憶更加珍貴。", "answer": "Some of students like a photography because they can record the great moments in their life. This makes their memory more precious.", "corrected": "Some students like photography because they can record beautiful moments in their lives. This makes their memories more precious.", "notes": [["錯誤", "Some of students", "Some students", "泛指有些學生不用 of。"], ["錯誤", "a photography", "photography", "photography 不可數。"], ["建議", "the great moments", "beautiful moments", "泛指美好時刻，不用 the。"], ["錯誤", "their life / memory", "their lives / memories", "主詞是複數 they。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "3.1", "title": "智慧裝置", "zh": "智慧型裝置讓人們可以隨時接收最新資訊。這對忙碌的現代人特別有幫助。", "answer": "Technical device help people receive new information. That is important for busy people nowadays.", "corrected": "Smart devices allow people to receive the latest information at any time. This is especially helpful for busy people today.", "notes": [["錯誤", "Technical device", "Smart devices", "device 是可數名詞；此處泛指多種智慧型裝置，用複數最自然。"], ["建議", "new information", "the latest information", "題目是「最新資訊」，latest 前通常加 the。"], ["建議", "help people receive", "allow people to receive", "原句可理解；allow sb. to V 更貼近「讓人們可以……」。"], ["漏譯", "—", "at any time", "題目有「隨時」，翻譯時要補出來。"], ["建議", "That is important", "This is especially helpful", "題目是「特別有幫助」，這樣更貼切。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞", "漏譯"]}, {"set": "翻譯整理 3.1–10.2", "id": "3.2", "title": "科技依賴", "zh": "由於這些設備功能強大，人們越來越依賴它們。這也改變了人們的生活習慣。", "answer": "According to these powerful device, people will rely on them more. That will changed people's life habits.", "corrected": "Because these devices are powerful, people increasingly rely on them. This has also changed people's living habits.", "notes": [["錯誤", "According to", "Because / Because of", "according to =「根據」，不能表示「由於」。"], ["錯誤", "these powerful device", "these powerful devices", "these 後接複數名詞。"], ["建議", "will rely on them more", "increasingly rely on them", "更自然表達「越來越依賴」。"], ["錯誤", "will changed", "has changed", "will 後只能接原形；題意又偏向已造成的改變。"], ["建議", "life habits", "living habits / lifestyles", "較自然搭配。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞", "搭配"]}, {"set": "翻譯整理 3.1–10.2", "id": "4.1", "title": "網路購物", "zh": "網路購物讓人們可以輕鬆比較價格，並選擇最合適的商品。這節省了大量時間。", "answer": "Online shopping helps people compare prices easily, selecting a suitable product, which saves a lot of time.", "corrected": "Online shopping helps people compare prices easily and select the most suitable products, which saves a lot of time.", "notes": [["錯誤", "compare prices easily, selecting...", "compare prices easily and select...", "help 後面的兩個動作應維持平行：compare ... and select ...。"], ["建議", "a suitable product", "the most suitable products", "題目是「最合適的商品」，用最高級更精準。"]], "date": "", "source": "過去對話／題本照片", "tags": []}, {"set": "翻譯整理 3.1–10.2", "id": "4.2", "title": "網購疑慮", "zh": "然而，有些消費者擔心產品品質與實物不符。因此，他們在購買前會參考評價。", "answer": "However, some of customer will worry a quality of product which unlike; therefore, they will read reviews before they buy it.", "corrected": "However, some customers worry about product quality and whether the actual item will match what they see online. Therefore, they read reviews before making a purchase.", "notes": [["錯誤", "some of customer", "some customers", "泛指「一些消費者」直接用 some + 複數名詞。"], ["錯誤", "worry a quality", "worry about product quality", "worry about + N。"], ["錯誤", "which unlike", "whether the actual item will match what they see online", "原文是「實物不符」，需要完整表達「是否與實物一致」。"], ["建議", "before they buy it", "before making a purchase", "兩者都可；後者較精簡正式。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "5.1", "title": "線上遊戲", "zh": "線上遊戲為玩家提供了一個互動的平台。玩家可以與來自世界各地的人合作或競爭。", "answer": "Online games provide an interactive platform for a gamer. People can cooperate or complete with people which come from world.", "corrected": "Online games provide an interactive platform for players. They can cooperate or compete with people from all over the world.", "notes": [["建議", "for a gamer", "for players", "泛指玩家用複數較自然。"], ["錯誤", "complete with", "compete with", "complete = 完成；compete = 競爭。"], ["錯誤", "people which", "people who", "先行詞是人，用 who。"], ["錯誤", "come from world", "from all over the world", "「來自世界各地」的自然說法。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "5.2", "title": "團隊合作", "zh": "透過團隊合作，玩家可以提升解決問題的能力。這也有助於培養溝通技巧。", "answer": "Through teamwork, players can improve the ability of solving problems; also, it cultivate skills of communication.", "corrected": "Through teamwork, players can improve their ability to solve problems. This also helps cultivate communication skills.", "notes": [["錯誤", "the ability of solving problems", "their ability to solve problems", "ability to V 是最穩定的搭配。"], ["錯誤", "it cultivate", "This also helps cultivate", "it 指涉不清，且 cultivate 需配合主詞形式。"], ["錯誤", "skills of communication", "communication skills", "固定常見搭配。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "搭配"]}, {"set": "翻譯整理 3.1–10.2", "id": "6.1", "title": "資訊安全", "zh": "為了保護個人資料，使用者應該避免點擊可疑連結。這能降低被詐騙的風險。", "answer": "In order to protect individual's information. Users should avoid to spot dangerous links, which can defines a risk of being scammed.", "corrected": "To protect personal information, users should avoid clicking suspicious links. This can reduce the risk of being scammed.", "notes": [["建議", "individual's information", "personal information", "「個人資料」常用 personal information。"], ["錯誤", "avoid to spot", "avoid clicking", "avoid + V-ing；spot 也不是「點擊」。"], ["建議", "dangerous links", "suspicious links", "「可疑連結」用 suspicious links。"], ["錯誤", "which can defines a risk", "This can reduce the risk", "define 不能表示「降低風險」，且 can 後接原形。"], ["重點", "—", "reduce the risk of being scammed", "reduce the risk of + V-ing。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "6.2", "title": "帳戶安全", "zh": "設定強密碼並定期更換，是確保帳戶安全的重要方法。這有助於保護個人隱私。", "answer": "Setting a strong password and replacing it regularly are important way to garantee a safety of account, which helps protect a individual privacy.", "corrected": "Setting a strong password and changing it regularly is an important way to ensure account security. This helps protect personal privacy.", "notes": [["建議", "replacing it regularly", "changing it regularly", "change a password 是常見搭配。"], ["錯誤", "are important way", "is an important way", "整套「設定＋定期更換」可視為一種方法。"], ["錯誤", "garantee", "guarantee / ensure", "garantee 拼字錯誤；此處 ensure 更自然。"], ["錯誤", "a safety of account", "account security", "固定自然搭配。"], ["錯誤", "a individual privacy", "personal privacy", "privacy 不可數；a individual 也有冠詞錯誤。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞", "搭配"]}, {"set": "翻譯整理 3.1–10.2", "id": "7.1", "title": "網路與學習", "zh": "網際網路提供了便利與效率，使人們能快速取得資訊。這對學習非常有幫助。", "answer": "The Internet provides conveniences and efficiency which help people obtain information quickly. That is quite useful for studying.", "corrected": "The Internet provides convenience and efficiency, allowing people to obtain information quickly. This is very helpful for learning.", "notes": [["錯誤", "conveniences", "convenience", "表示抽象「便利」時通常不可數。"], ["建議", "which help people obtain...", "allowing people to obtain...", "分詞構句能更自然表示前句帶來的結果。"], ["建議", "That is quite useful", "This is very helpful", "指前句整件事時 This 較自然。"], ["建議", "for studying", "for learning", "題目是「對學習有幫助」，learning 更直接。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "7.2", "title": "過度依賴網路", "zh": "然而，過度依賴網路可能會造成問題，例如缺乏面對面的溝通。這可能影響人際關係。", "answer": "However, depending on the Internet may cause problems too much, for example lack a face-to-face communication, affecting interactions.", "corrected": "However, overreliance on the Internet may cause problems, such as a lack of face-to-face communication. This may affect interpersonal relationships.", "notes": [["錯誤", "cause problems too much", "cause many problems / may cause problems", "too much 不能這樣直接修飾 problems。"], ["錯誤", "for example lack", "such as a lack of", "舉例後需要完整名詞片語。"], ["錯誤", "a face-to-face communication", "face-to-face communication", "communication 此處為不可數概念。"], ["建議", "interactions", "interpersonal relationships", "原文是「人際關係」，後者更精準。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "8.1", "title": "資訊可靠性", "zh": "由於資訊量龐大，人們有時難以判斷哪些資訊是可靠的。這可能導致誤解。", "answer": "Due to a large amount of the information, people sometimes are difficult to ensure which the information is reliable, which might cause misunderstandings.", "corrected": "Due to the large amount of information available, it is sometimes difficult for people to determine which information is reliable. This may cause misunderstandings.", "notes": [["錯誤", "a large amount of the information", "a large amount of information", "information 不可數；泛指不加 the。"], ["錯誤", "people sometimes are difficult to", "it is sometimes difficult for people to", "人不是 difficult；用 It is + adj. + for sb. + to V。"], ["錯誤", "ensure which", "determine / judge which", "ensure 不適合接 which 子句表示「判斷哪些」。"], ["建議", "which might cause misunderstandings", "This may cause misunderstandings", "拆句可避免 which 指涉模糊。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞"]}, {"set": "翻譯整理 3.1–10.2", "id": "8.2", "title": "批判性思考", "zh": "因此，培養批判性思考能力是非常重要的。這能幫助我們做出正確判斷。", "answer": "Thus, it is important to cultivate critical thinking, which can help us to a right decision.", "corrected": "Therefore, it is very important to cultivate critical-thinking skills. This can help us make correct judgments.", "notes": [["建議", "cultivate critical thinking", "cultivate critical-thinking skills", "兩者都可；skills 更完整自然。"], ["錯誤", "help us to a right decision", "help us make correct judgments", "help sb. (to) V；「做出判斷」用 make a judgment。"]], "date": "", "source": "過去對話／題本照片", "tags": []}, {"set": "翻譯整理 3.1–10.2", "id": "9.1", "title": "即時通訊", "zh": "即時通訊軟體讓人們可以快速傳遞訊息。這提高了溝通的效率。", "answer": "Instant software allow people translate messages, which develop a efficiency of communication.", "corrected": "Instant messaging apps allow people to deliver messages quickly. This improves communication efficiency.", "notes": [["錯誤", "Instant software", "Instant messaging apps", "「即時通訊軟體」常用 instant messaging apps。"], ["錯誤", "allow people translate", "allow people to deliver / send", "allow + 人 + to V。"], ["漏譯", "—", "quickly", "題目有「快速」。"], ["錯誤", "develop a efficiency", "improve communication efficiency", "efficiency 不可數；「提高效率」用 improve efficiency。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "名詞", "漏譯"]}, {"set": "翻譯整理 3.1–10.2", "id": "9.2", "title": "線上溝通缺點", "zh": "然而，缺乏面對面的互動可能會導致誤解。這是線上溝通的一大缺點。", "answer": "However, lacking face-to-face communication may lead to misunderstanding. This is a main drawback for online communication.", "corrected": "However, a lack of face-to-face interaction may lead to misunderstandings. This is a major drawback of online communication.", "notes": [["建議", "lacking face-to-face communication", "a lack of face-to-face interaction", "原句可理解；名詞化更自然。"], ["建議", "misunderstanding", "misunderstandings", "泛指多次誤解時複數更自然。"], ["建議", "a main drawback", "a major drawback", "a major drawback 是常見搭配。"], ["錯誤", "drawback for", "drawback of", "固定搭配 a drawback of sth.。"]], "date": "", "source": "過去對話／題本照片", "tags": ["名詞", "搭配"]}, {"set": "翻譯整理 3.1–10.2", "id": "10.1", "title": "科技進步", "zh": "隨著科技進步，人們越來越依賴數位工具來完成日常任務。這改變了生活方式。", "answer": "Through a tech developing, people rely on technical tools more and more, which has changed the way of lives.", "corrected": "As technology advances, people increasingly rely on digital tools to complete their daily tasks, which has changed the way they live.", "notes": [["錯誤", "Through a tech developing", "As technology advances", "「隨著科技進步」不能用 through a tech developing。"], ["建議", "technical tools", "digital tools", "題目是「數位工具」。"], ["建議", "more and more", "increasingly", "原意可懂；increasingly 更正式。"], ["漏譯", "—", "to complete their daily tasks", "題目有「來完成日常任務」。"], ["錯誤", "the way of lives", "the way they live", "「生活方式」可用 the way people live / the way they live。"]], "date": "", "source": "過去對話／題本照片", "tags": ["漏譯"]}, {"set": "翻譯整理 3.1–10.2", "id": "10.2", "title": "網路影響", "zh": "總而言之，網際網路對現代社會影響深遠。我們應該善用它，同時避免其負面影響。", "answer": "All in all, Internet impacts our society deeply. We should take advantages of using them; meanwhile, avoiding negative impacts.", "corrected": "In conclusion, the Internet has had a profound impact on modern society. We should make good use of it while avoiding its negative effects.", "notes": [["錯誤", "Internet", "the Internet", "一般寫法加 the。"], ["建議", "impacts our society deeply", "has had a profound impact on modern society", "更自然、正式的搭配。"], ["錯誤", "take advantages of using them", "make good use of it", "take advantage of 不加 s；Internet 也應以 it 指代。"], ["錯誤", "meanwhile, avoiding", "while avoiding", "while + V-ing 可表「同時……」。"], ["建議", "negative impacts", "negative effects", "兩者都可；effects 在此更自然。"]], "date": "", "source": "過去對話／題本照片", "tags": ["動詞", "搭配"]}, {"set": "滿分實戰翻譯 1–2", "id": "1", "title": "高一新生適應校園", "zh": "越來越多的高一新生正發現，在第一週要適應校園生活是一大挑戰。", "answer": "More and more first grade students find it challenger to adapt school life.", "corrected": "More and more high school freshmen are finding it a great challenge to adapt to campus life during the first week.", "score": "2 / 4", "notes": [["錯誤", "first grade students", "high school freshmen", "「高一新生」在高中語境中用 freshmen。"], ["錯誤", "challenger", "a challenge", "challenger 是「挑戰者」；這裡要用 challenge。"], ["錯誤", "adapt school life", "adapt to school life", "adapt to + N。"], ["建議", "find it", "are finding it", "原文「正發現」用進行式更貼切。"], ["建議", "More and more", "An increasing number of", "原本正確；後者較正式。"]], "date": "", "source": "過去對話／題本照片", "tags": []}, {"set": "滿分實戰翻譯 1–2", "id": "2", "title": "破冰活動", "zh": "為了幫助新生熟悉新環境，導師常將他們分成不同小組進行破冰活動。", "answer": "To help students get familiar with the new environment, teachers often divide them into many teams to do the ice-break activities.", "corrected": "To help freshmen become familiar with the new environment, homeroom teachers often divide them into different groups to conduct ice-breaking activities.", "score": "3.5 / 4", "notes": [["建議", "students", "freshmen", "原文是「新生」。"], ["建議", "teachers", "homeroom teachers", "「導師」更精準。"], ["建議", "many teams", "different groups", "「不同小組」更自然。"], ["錯誤", "ice-break activities", "ice-breaking activities", "需要形容詞 ice-breaking。"], ["建議", "get familiar with", "become familiar with", "原句可接受；後者較正式。"]], "date": "", "source": "過去對話／題本照片", "tags": []}];
let activeIndex=-1,listMode='all',hideCorrected=false,studyMode=false;
const setFilter=document.getElementById('setFilter');
const groups=['全部題組',...new Set(DATA.map(x=>x.set))];
setFilter.innerHTML=groups.map(g=>`<option value="${g==='全部題組'?'':escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
document.getElementById('countBadge').textContent=DATA.length+' 題';
function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function filteredData(){const q=document.getElementById('search').value.trim().toLowerCase(),set=setFilter.value;return DATA.map((x,i)=>({x,i})).filter(({x})=>{if(set&&x.set!==set)return false;if(q&&!JSON.stringify(x).toLowerCase().includes(q))return false;if(listMode==='errors'&&!x.notes.some(n=>n[0]==='錯誤'))return false;if(listMode==='missing'&&!x.notes.some(n=>n[0]==='漏譯'))return false;return true})}
function setMode(mode){listMode=mode;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));document.getElementById(mode==='all'?'allChip':mode==='errors'?'errorChip':'missChip').classList.add('on');renderList()}
function renderList(){const d=filteredData();document.getElementById('visibleCount').textContent=d.length;document.getElementById('errorCount').textContent=d.flatMap(o=>o.x.notes).filter(n=>n[0]==='錯誤').length;document.getElementById('suggestCount').textContent=d.flatMap(o=>o.x.notes).filter(n=>n[0]==='建議').length;document.getElementById('list').innerHTML=d.map(({x,i})=>`<div class="item ${i===activeIndex?'on':''}" onclick="show(${i})"><b>${escapeHtml(x.id)}｜${escapeHtml(x.title)}</b><div class="meta"><span>${escapeHtml(x.set)}</span><span class="badge">${x.notes.length} 重點</span>${x.notes.some(n=>n[0]==='錯誤')?'<span class="badge">有錯</span>':''}${x.notes.some(n=>n[0]==='漏譯')?'<span class="badge">漏譯</span>':''}</div></div>`).join('')||'<div class="item">沒有符合的題目。</div>'}
function noteClass(kind){return(kind==='錯誤'||kind==='漏譯')?'error':kind==='建議'?'suggest':'important'}
function show(i){activeIndex=i;renderList();const x=DATA[i],tags=(x.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');document.getElementById('right').innerHTML=`<div class="detail"><div class="crumb">${escapeHtml(x.set)} / 第 ${escapeHtml(x.id)} 題</div><div class="titleRow"><h2>${escapeHtml(x.title)}</h2>${x.score?`<span class="score">${escapeHtml(x.score)}</span>`:''}</div><div class="zh">${escapeHtml(x.zh)}</div><div class="actions"><button class="btn ${hideCorrected?'on':''}" onclick="toggleCorrected()">${hideCorrected?'顯示訂正版':'隱藏訂正版'}</button><button class="btn ${studyMode?'on':''}" onclick="toggleStudy()">${studyMode?'退出重翻模式':'重翻模式'}</button><button class="btn" onclick="copyCorrected()">複製訂正版</button></div><div class="grid"><div class="pane"><b>你的作答</b><br><br>${escapeHtml(x.answer)}</div><div class="pane good ${hideCorrected?'hiddenAnswer':''}"><b>訂正版</b><br><br>${escapeHtml(x.corrected)}</div></div><h3 class="sectionTitle">訂正重點</h3>${x.notes.map(n=>`<div class="note ${noteClass(n[0])}"><div class="noteTop"><span class="kind">${escapeHtml(n[0])}</span><b>${escapeHtml(n[1])}</b><span class="arrow">→ ${escapeHtml(n[2])}</span></div><div class="explain">${escapeHtml(n[3])}</div></div>`).join('')}${tags?`<div class="tagRow">${tags}</div>`:''}</div>`}
function toggleCorrected(){hideCorrected=!hideCorrected;if(activeIndex>=0)show(activeIndex)}
function toggleStudy(){studyMode=!studyMode;hideCorrected=studyMode;document.getElementById('modeBanner').classList.toggle('on',studyMode);if(activeIndex>=0)show(activeIndex)}
function copyCorrected(){if(activeIndex<0)return;navigator.clipboard?.writeText(DATA[activeIndex].corrected)}
renderList();
</script>
</body></html>
